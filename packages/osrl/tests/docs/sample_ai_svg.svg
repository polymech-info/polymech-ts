<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <circle id="ball" cx="200" cy="200" r="15" fill="blue" />
    <rect id="cube" x="100" y="100" width="200" height="200" stroke="black" fill="transparent" stroke-width="2"/>
    <animateTransform id="orbit1" attributeName="transform" attributeType="XML" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
    <animateTransform id="orbit2" attributeName="transform" attributeType="XML" type="rotate" from="90 200 200" to="450 200 200" dur="4s" repeatCount="indefinite"/>
    <animateTransform id="orbit3" attributeName="transform" attributeType="XML" type="rotate" from="180 200 200" to="540 200 200" dur="4s" repeatCount="indefinite"/>
    <animateTransform id="orbit4" attributeName="transform" attributeType="XML" type="rotate" from="270 200 200" to="630 200 200" dur="4s" repeatCount="indefinite"/>
    <animate id="bounceX" attributeName="cx" values="115; 285; 115" dur="3s" repeatCount="indefinite"/>
    <animate id="bounceY" attributeName="cy" values="115; 285; 115" dur="3s" repeatCount="indefinite"/>
  </defs>
  <use xlink:href="#ball">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" from="100 0" to="100 0" begin="0s" dur="0s" fill="freeze"/>
    <animateTransform xlink:href="#orbit1" />
  </use>
  <use xlink:href="#ball">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" from="0 100" to="0 100" begin="0s" dur="0s" fill="freeze"/>
    <animateTransform xlink:href="#orbit2" />
  </use>
  <use xlink:href="#ball">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" from="-100 0" to="-100 0" begin="0s" dur="0s" fill="freeze"/>
    <animateTransform xlink:href="#orbit3" />
  </use>
  <use xlink:href="#ball">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" from="0 -100" to="0 -100" begin="0s" dur="0s" fill="freeze"/>
    <animateTransform xlink:href="#orbit4" />
  </use>
  <use xlink:href="#cube" />
  <circle cx="115" cy="115" r="15" fill="red">
    <animate xlink:href="#bounceX" />
    <animate xlink:href="#bounceY" />
  </circle>
</svg>