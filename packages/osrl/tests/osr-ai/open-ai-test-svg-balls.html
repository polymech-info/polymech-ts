
<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ball1, .ball2, .ball3, .ball4 {
      fill: red;
      r: 10;
    }
    @keyframes rotate1 {
      0%, 100% { cx: 50; cy: 50; }
      25% { cx: 150; cy: 50; }
      50% { cx: 150; cy: 150; }
      75% { cx: 50; cy: 150; }
    }
    @keyframes rotate2 {
      0%, 100% { cx: 150; cy: 50; }
      25% { cx: 150; cy: 150; }
      50% { cx: 50; cy: 150; }
      75% { cx: 50; cy: 50; }
    }
    @keyframes rotate3 {
      0%, 100% { cx: 150; cy: 150; }
      25% { cx: 50; cy: 150; }
      50% { cx: 50; cy: 50; }
      75% { cx: 150; cy: 50; }
    }
    @keyframes rotate4 {
      0%, 100% { cx: 50; cy: 150; }
      25% { cx: 50; cy: 50; }
      50% { cx: 150; cy: 50; }
      75% { cx: 150; cy: 150; }
    }
    .ball1 { animation: rotate1 4s linear infinite; }
    .ball2 { animation: rotate2 4s linear infinite; }
    .ball3 { animation: rotate3 4s linear infinite; }
    .ball4 { animation: rotate4 4s linear infinite; }
  </style>
  <rect x="50" y="50" width="100" height="100" fill="none" stroke="black"/>
  <circle class="ball1"/>
  <circle class="ball2"/>
  <circle class="ball3"/>
  <circle class="ball4"/>
</svg>
