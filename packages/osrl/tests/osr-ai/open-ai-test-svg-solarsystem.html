<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" style="background-color:black;">
    <!-- Background stars -->
    <defs>
        <circle id="star" r="1" fill="white"/>
    </defs>
    <g>
        <use href="#star" x="50" y="50"/>
        <use href="#star" x="130" y="150"/>
        <use href="#star" x="220" y="80"/>
        <use href="#star" x="700" y="160"/>
        <use href="#star" x="800" y="90"/>
        <use href="#star" x="900" y="200"/>
        <use href="#star" x="300" y="300"/>
        <use href="#star" x="500" y="400"/>
        <use href="#star" x="600" y="300"/>
        <use href="#star" x="200" y="450"/>
        <use href="#star" x="420" y="550"/>
        <use href="#star" x="620" y="150"/>
        <!-- Add more stars as needed to reach 100 stars -->
    </g>

    <!-- Sun -->
    <circle cx="500" cy="500" r="50" fill="yellow"/>

    <!-- Orbits -->
    <circle cx="500" cy="500" r="70" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="100" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="150" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="200" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="250" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="300" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="350" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="500" cy="500" r="400" stroke="white" stroke-width="0.5" fill="none"/>

    <!-- Planets and Animations -->
    <g>
        <a xlink:href="https://en.wikipedia.org/wiki/Mercury_(planet)" target="_blank">
            <circle cx="500" cy="430" r="5" fill="gray">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="10s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Venus" target="_blank">
            <circle cx="500" cy="400" r="9" fill="khaki">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="15s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Earth" target="_blank">
            <circle cx="500" cy="350" r="9" fill="blue">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="20s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Mars" target="_blank">
            <circle cx="500" cy="300" r="5" fill="red">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="25s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Jupiter" target="_blank">
            <circle cx="500" cy="250" r="20" fill="brown">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="30s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Saturn" target="_blank">
            <circle cx="500" cy="200" r="18" fill="yellow">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="35s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Uranus" target="_blank">
            <circle cx="500" cy="150" r="15" fill="lightblue">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="40s" repeatCount="indefinite"/>
            </circle>
        </a>
        <a xlink:href="https://en.wikipedia.org/wiki/Neptune" target="_blank">
            <circle cx="500" cy="100" r="15" fill="blue">
                <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="45s" repeatCount="indefinite"/>
            </circle>
        </a>
    </g>
    
    <!-- Legend -->
    <g fill="white" font-size="12" font-family="Arial" transform="translate(10, 20)">
        <text x="0" y="0">Sun: Diameter = 1.39 million km, Mass = 1.989 × 10^30 kg, Age = ~4.6 billion years</text>
        <text x="0" y="20">Mercury: Diameter = 4,880 km, Mass = 3.285 × 10^23 kg, Age = ~4.5 billion years</text>
        <text x="0" y="40">Venus: Diameter = 12,104 km, Mass = 4.867 × 10^24 kg, Age = ~4.5 billion years</text>
        <text x="0" y="60">Earth: Diameter = 12,742 km, Mass = 5.972 × 10^24 kg, Age = ~4.5 billion years</text>
        <text x="0" y="80">Mars: Diameter = 6,779 km, Mass = 6.39 × 10^23 kg, Age = ~4.5 billion years</text>
        <text x="0" y="100">Jupiter: Diameter = 139,820 km, Mass = 1.898 × 10^27 kg, Age = ~4.5 billion years</text>
        <text x="0" y="120">Saturn: Diameter = 116,460 km, Mass = 5.683 × 10^26 kg, Age = ~4.5 billion years</text>
        <text x="0" y="140">Uranus: Diameter = 50,724 km, Mass = 8.681 × 10^25 kg, Age = ~4.5 billion years</text>
        <text x="0" y="160">Neptune: Diameter = 49,244 km, Mass = 1.024 × 10^26 kg, Age = ~4.5 billion years</text>
    </g>
</svg>
